<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Insight Brief</title>
<style>
:root{--navy:#102a43;--ink:#17212b;--muted:#697682;--line:#dfe4e8;--bg:#fff;--soft:#f5f7f8;--red:#a83333}
*{box-sizing:border-box} body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;line-height:1.55}
button,a{font:inherit}.app{max-width:820px;margin:auto;padding-bottom:78px}
.mast{border-bottom:1px solid var(--line);padding:18px 17px 12px}.mastTop{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.logo{font-family:Georgia,"Times New Roman",serif;font-weight:900;font-size:29px;letter-spacing:-.03em;color:var(--navy)}
.date{font-size:11px;color:var(--muted);text-align:right}.tagline{font-size:11px;color:var(--muted);margin-top:2px}
.navline{display:flex;gap:18px;overflow:auto;padding:10px 17px;border-bottom:1px solid var(--line);white-space:nowrap;scrollbar-width:none}.navline::-webkit-scrollbar{display:none}
.cat{border:0;background:none;padding:0;font-size:12px;font-weight:800;color:#53606b}.cat.active{color:var(--navy);text-decoration:underline;text-underline-offset:5px}
.edition{padding:13px 17px 8px;display:flex;justify-content:space-between;align-items:center}.edition b{font-size:12px;letter-spacing:.08em}.edition span{font-size:11px;color:var(--muted)}
.hero{padding:0 17px 17px;border-bottom:7px solid var(--soft)}.heroLabel{font-size:10px;font-weight:900;color:var(--red);letter-spacing:.12em;margin-bottom:6px}
.hero h1{font-family:Georgia,"Times New Roman","Yu Mincho",serif;font-size:29px;line-height:1.28;margin:0 0 9px;letter-spacing:-.02em}
.hero p{font-size:14px;color:#4d5964;margin:0 0 10px}.meta{font-size:11px;color:var(--muted);display:flex;gap:9px;flex-wrap:wrap}
.section{padding:17px}.sectionHead{border-top:3px solid var(--navy);padding-top:7px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.sectionHead h2{font-size:14px;margin:0;letter-spacing:.06em}.sectionHead span{font-size:10px;color:var(--muted)}
.story{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}.story:last-child{border-bottom:0}.storyCat{font-size:10px;color:var(--red);font-weight:900;letter-spacing:.06em}
.story h3{font-family:Georgia,"Times New Roman","Yu Mincho",serif;font-size:19px;line-height:1.38;margin:4px 0 5px}.story p{font-size:12px;color:var(--muted);margin:0}
.reason{margin-top:7px;font-size:11px;color:#53606b}.reason b{color:var(--navy)}
.timebox{background:var(--soft);padding:12px 17px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px;display:flex;justify-content:space-between;gap:15px}.timebox strong{color:var(--navy)}
.end{margin:15px 17px 22px;border:1px solid var(--line);padding:15px;text-align:center;font-family:Georgia,"Yu Mincho",serif}.end small{display:block;color:var(--muted);font-family:inherit;margin-top:4px}
.view{display:none}.view.active{display:block}.back{border:0;background:white;color:var(--navy);font-weight:800;padding:15px 17px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.article{padding:20px 18px}.article .kicker{font-size:11px;color:var(--red);font-weight:900}.article h1{font-family:Georgia,"Yu Mincho",serif;font-size:29px;line-height:1.35;margin:7px 0 9px}
.article .dek{font-size:15px;color:#53606b;border-bottom:1px solid var(--line);padding-bottom:15px}
.articleBlock{padding:15px 0;border-bottom:1px solid var(--line)}.articleBlock b{display:block;font-size:12px;color:var(--navy);margin-bottom:5px}.articleBlock p{margin:0;font-size:14px}
.axis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:12px}.axis div{background:white;text-align:center;padding:8px 3px;font-size:10px;color:var(--muted)}.axis strong{display:block;font-size:18px;color:var(--ink)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.btn{border:0;padding:12px;font-weight:800}.primary{background:var(--navy);color:white}.secondary{background:var(--soft);color:var(--navy)}
.save{width:100%;margin-top:8px;padding:11px;background:white;border:1px solid var(--line);font-weight:800;color:var(--navy)}
.source{display:block;margin-top:10px;padding:11px;border:1px solid var(--line);color:var(--navy);text-decoration:none;font-weight:800;font-size:12px}
.chat{display:none;margin-top:12px;background:var(--soft);padding:12px;font-size:12px}.chat div{margin:6px 0}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(820px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:5}
.bn{border:0;background:none;color:var(--muted);font-size:10px;font-weight:800}.bn strong{display:block;font-size:18px}.bn.active{color:var(--navy)}
.empty{margin:20px 17px;padding:25px;border:1px solid var(--line);text-align:center;color:var(--muted);font-size:12px}
@media(min-width:650px){.hero h1{font-size:38px}.story h3{font-size:21px}.section{padding-left:24px;padding-right:24px}}
</style>
</head>
<body><div class="app">
<div id="home" class="view active">
<header class="mast"><div class="mastTop"><div><div class="logo">Insight Brief</div><div class="tagline">自分の生活から、社会と世界を見る。</div></div><div id="date" class="date"></div></div></header>
<div id="cats" class="navline"></div>
<div class="edition"><b>TODAY'S BRIEF</b><span>8 stories ・ 約8分</span></div>
<div id="hero"></div>
<div class="timebox"><span>今日の情報時間 <strong>8 / 10分</strong></span><span>残り2分は深掘り用</span></div>
<div id="sections"></div>
<div class="end"><b>Today's brief is complete.</b><small>今日はもうニュースを追わなくても大丈夫です。</small></div>
</div>
<div id="detail" class="view"></div>
<div id="archive" class="view"></div>
<div id="tracking" class="view"></div>
</div>
<nav class="bottom"><button class="bn active" data-v="home"><strong>⌂</strong>今日</button><button class="bn" data-v="archive"><strong>▤</strong>資料集</button><button class="bn" data-v="tracking"><strong>⌁</strong>追跡</button></nav>
<script>
let data=[
{id:1,c:'NEWS',title:'政治・経済は「今日の騒ぎ」より、構造が変わるニュースを読む',sum:'制度、政策、景気、産業構造。時間が経っても意味の残る変化を優先する。',why:'一年後・10年後にも意味が残るニュースを中心にする',read:'1分',imp:'高',rel:'中',what:'日々の発言や騒動を追い続けるのではなく、制度・政策・景気・産業構造などの変化を中心に選びます。',important:'速報を追うだけでは情報量が増える一方で、長期的な理解につながりにくいためです。',me:'家計、仕事、地域経済など、自分の生活へどうつながるかまで整理します。',fact:'これはInsight Briefの編集ルールです。',unknown:'実運用では最新情報を取得し、一次情報と複数報道を照合します。',axis:['○','◎','◎','◎']},
{id:2,c:'MY ECONOMY',title:'身近な企業から経済を見る。企業 → 業界 → マクロへ視点を広げる',sum:'物流、通信、小売、金融など、日々接している企業を経済の入口にする。',why:'GDPや為替を、自分の生活につながる変化として理解する',read:'1分',imp:'高',rel:'高',what:'利用する企業・サービスの決算、商品、価格、経営方針を起点に情報を整理します。',important:'大きな経済指標だけを見るより、身近な企業から広げた方が変化を具体的に理解できるためです。',me:'仕事や家計で関係する企業を中心に扱います。',fact:'企業IRなどの一次情報を優先します。',unknown:'地域単位など公開されない数字は推測しません。',axis:['◎','◎','○','○']},
{id:3,c:'DELIVERY',title:'物流は「全国 → 地域 → 現場」の3層で見る',sum:'宅配各社の経営、物流政策、地域事情と日々の配達実感をつなげる。',why:'現場感覚と会社・業界データを結びつける',read:'1分',imp:'高',rel:'高',what:'物流政策、宅配各社の公式発表、地域情報、自分の現場感覚をつなげて考えます。',important:'一日の荷量や効率を、より長い流れの中で解釈できるためです。',me:'荷量、効率、委託運用、置き配、不在対応などに直結します。',fact:'公開情報と現場での経験は区別して扱います。',unknown:'主管支店など公開されないデータは分からないものとして扱います。',axis:['◎','◎','○','△']},
{id:4,c:'AI',title:'AIは噂より「実際に使い方が変わる更新」だけを拾う',sum:'提供開始された機能や大きな技術・社会変化を優先する。',why:'AI分野は情報量と煽りが特に多い',read:'45秒',imp:'中',rel:'高',what:'モデル比較や噂を全部追わず、実際に提供開始された機能や重要な変化を扱います。',important:'小さな更新を追い続ける時間を減らし、実生活で使える変化に集中するためです。',me:'情報整理、学習、仕事、アプリ作成に関係するものを優先します。',fact:'本番では公式発表を一次情報として確認します。',unknown:'新機能の長期的価値は実際に使って判断します。',axis:['◎','○','△','△']},
{id:5,c:'LEARNING',title:'学習情報は「知る」より、次の学習行動につながるものを',sum:'放送大学、書籍、社会人学習。情報収集自体を目的化しない。',why:'学ぶための情報集めで学習時間を減らさない',read:'45秒',imp:'参考',rel:'高',what:'科目、新刊、講演、学習法から実際の学習計画に関係するものを選びます。',important:'教材や学習法の情報を集めすぎるより、実際に学ぶ時間を増やすためです。',me:'次に何を読む・学ぶ・申し込むかにつながる情報を優先します。',fact:'行動につながるものを重視する編集方針です。',unknown:'教材の相性は実際に試す必要があります。',axis:['◎','○','△','×']},
{id:6,c:'RADIO',title:'ラジオは「役に立つか」ではなく、楽しむための情報として',sum:'番組、出演者、特集、新番組を短時間で確認する。',why:'趣味は有益性だけで切り捨てない',read:'40秒',imp:'趣味',rel:'高',what:'好きな番組や出演者、特集などを短時間で確認します。',important:'SNSを延々巡回しなくても趣味の楽しみを残すためです。',me:'聴き逃したくない番組や面白そうな特集の発見につながります。',fact:'趣味カテゴリでは長期価値の基準を緩めます。',unknown:'放送内容は当日変更される場合があります。',axis:['◎','△','×','×']},
{id:7,c:'EKIDEN',title:'大学駅伝は、好きだから細かく追ってよい',sum:'大会、大学、選手、エントリー、結果。趣味の時間として楽しむ。',why:'好きなことに時間を使うこと自体に価値がある',read:'1分',imp:'趣味',rel:'高',what:'大会、大学、選手、エントリー、結果、取材記事をコンパクトにまとめます。',important:'効率だけで趣味を削らないためです。',me:'観戦をより楽しむための情報として扱います。',fact:'公式発表と専門報道を中心にします。',unknown:'選手の状態など推測情報は事実と分けます。',axis:['◎','○','×','×']},
{id:8,c:'WORLD / OUTSIDE',title:'関心外からも毎日一本。自分向け最適化の外へ出る',sum:'日本で大きく扱われなくても、世界の流れを変えるニュースを選ぶ。',why:'自分向け最適化による視野の狭まりを防ぐ',read:'1分',imp:'中',rel:'低',what:'国内では大きく扱われなくても、国際的に重要なニュースを一本選びます。',important:'自分に関係する情報だけでは世界の大きな変化を見落とすためです。',me:'直接関係がなくても長期的な社会理解の材料になります。',fact:'本番では海外主要報道と一次情報を照合します。',unknown:'日本への影響が不明なら不明のまま示します。',axis:['○','◎','◎','○']}
];
const cats=['ALL','NEWS','MY ECONOMY','DELIVERY','AI','LEARNING','RADIO','EKIDEN','WORLD / OUTSIDE']; let filter='ALL';
let saved=new Set(JSON.parse(localStorage.getItem('ibs')||'[]')), tracked=new Set(JSON.parse(localStorage.getItem('ibt')||'[]'));
const $=s=>document.querySelector(s); $('#date').innerHTML=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date())+'<br>PERSONAL EDITION';
function catsRender(){$('#cats').innerHTML=cats.map(x=>`<button class="cat ${filter===x?'active':''}" onclick="setCat('${x.replace(/'/g,"\\'")}')">${x}</button>`).join('')}
function setCat(c){filter=c;renderHome()}
function renderHome(){catsRender();let arr=filter==='ALL'?data:data.filter(x=>x.c===filter); if(!arr.length)return;
let lead=arr[0];$('#hero').innerHTML=`<article class="hero" onclick="openArticle(${lead.id})"><div class="heroLabel">TOP STORY ・ ${lead.c}</div><h1>${lead.title}</h1><p>${lead.sum}</p><div class="meta"><span>重要度 ${lead.imp}</span><span>関連 ${lead.rel}</span><span>約${lead.read}</span></div></article>`;
let rest=arr.slice(1);let groups={};rest.forEach(x=>(groups[x.c]??=[]).push(x));
$('#sections').innerHTML=Object.entries(groups).map(([c,xs])=>`<section class="section"><div class="sectionHead"><h2>${c}</h2><span>${xs.length} STORY</span></div>${xs.map(x=>`<article class="story" onclick="openArticle(${x.id})"><div class="storyCat">${x.c}</div><h3>${x.title}</h3><p>${x.sum}</p><div class="reason"><b>WHY THIS MATTERS</b>　${x.why}</div><div class="meta" style="margin-top:7px"><span>重要度 ${x.imp}</span><span>関連 ${x.rel}</span><span>約${x.read}</span></div></article>`).join('')}</section>`).join('')}
function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$('#'+v).classList.add('active');document.querySelectorAll('.bn').forEach(x=>x.classList.toggle('active',x.dataset.v===v));if(v==='archive')renderArchive();if(v==='tracking')renderTrack();scrollTo(0,0)}
function openArticle(id){let x=data.find(a=>a.id===id);$('#detail').innerHTML=`<button class="back" onclick="show('home')">← Insight Brief</button><article class="article"><div class="kicker">${x.c} ・ 約${x.read}</div><h1>${x.title}</h1><div class="dek">${x.sum}</div>
${[['何が起きた？',x.what],['なぜ重要？',x.important],['自分との関係',x.me],['確認できている事実',x.fact],['まだ分からないこと',x.unknown]].map(a=>`<div class="articleBlock"><b>${a[0]}</b><p>${a[1]}</p></div>`).join('')}
<div class="articleBlock"><b>時間軸評価</b><div class="axis">${['1週間後','今年','10年後','資料集'].map((a,i)=>`<div>${a}<strong>${x.axis[i]}</strong></div>`).join('')}</div></div>
<div class="actions"><button class="btn primary" onclick="toggleChat()">チャッピーと考える</button><button class="btn secondary" onclick="toggleTrack(${id})">${tracked.has(id)?'✓ 追跡中':'追跡する'}</button></div>
<button class="save" onclick="toggleSave(${id})">${saved.has(id)?'✓ 資料集に保存済み':'私の資料集に残す'}</button>
${x.sourceUrl?`<a class="source" href="${x.sourceUrl}" target="_blank" rel="noopener">↗ ${x.source||'公式情報'}を開く</a>`:''}
<div id="chat" class="chat"><div>・具体 → 背景 → 構造 → 自分への影響</div><div>・反対側から見るとどう見える？</div><div>・事実 / 解釈 / 推測を分ける</div><small>本番版でChatGPT対話へ接続予定。</small></div></article>`;show('detail')}
function toggleChat(){let e=$('#chat');e.style.display=e.style.display==='block'?'none':'block'}
function toggleSave(id){saved.has(id)?saved.delete(id):saved.add(id);localStorage.setItem('ibs',JSON.stringify([...saved]));openArticle(id)}
function toggleTrack(id){tracked.has(id)?tracked.delete(id):tracked.add(id);localStorage.setItem('ibt',JSON.stringify([...tracked]));openArticle(id)}
function renderArchive(){let xs=[...saved].map(id=>data.find(x=>x.id===id)).filter(Boolean);$('#archive').innerHTML=`<header class="mast"><div class="logo">My Archive</div><div class="tagline">時間が経っても残したい情報。</div></header>${xs.length?`<section class="section">${xs.map(x=>`<article class="story" onclick="openArticle(${x.id})"><div class="storyCat">${x.c}</div><h3>${x.title}</h3><p>${x.sum}</p></article>`).join('')}</section>`:`<div class="empty">まだ保存した記事はありません。</div>`}`}
function renderTrack(){let xs=[...tracked].map(id=>data.find(x=>x.id===id)).filter(Boolean);$('#tracking').innerHTML=`<header class="mast"><div class="logo">Follow-up</div><div class="tagline">「その後どうなった？」を忘れない。</div></header>${xs.length?`<section class="section">${xs.map(x=>`<article class="story" onclick="openArticle(${x.id})"><div class="storyCat">${x.c}</div><h3>${x.title}</h3><p>重要な続報があったときだけ更新するテーマ。</p></article>`).join('')}</section>`:`<div class="empty">追跡中のテーマはありません。</div>`}`}
document.querySelectorAll('.bn').forEach(x=>x.onclick=()=>show(x.dataset.v));renderHome();
async function loadLiveNews(){
  try{
    const res = await fetch('news.json?ts=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('news.json ' + res.status);
    const payload = await res.json();
    if(!Array.isArray(payload.stories) || payload.stories.length===0) return;

    const mapped = payload.stories.map((s,i)=>({
      id: 1000+i,
      c: s.category || 'NEWS',
      title: s.title || '公式情報',
      sum: s.summary || '公式発表。詳細は出典を確認してください。',
      why: s.why || '公式情報として確認する価値がある新着です。',
      read: '1分',
      imp: s.importance || '要確認',
      rel: s.relation || '要確認',
      what: s.summary || '公式発表の新着情報です。',
      important: s.why || '重要性は内容を確認して判断します。',
      me: '現時点では自分との関係を自動判定していません。次段階で個人向け評価を追加します。',
      fact: `${s.source || '公式情報'}が公開した情報です。`,
      unknown: '背景・影響・長期的重要性は、一次情報と追加資料を確認して判断します。',
      axis:['○','○','△','△'],
      source: s.source || '',
      sourceUrl: s.url || '',
      published: s.published || ''
    }));

    data = mapped;
    const liveCats = ['ALL', ...new Set(data.map(x=>x.c))];
    cats.splice(0, cats.length, ...liveCats);
    filter='ALL';

    const stamp = payload.updated_at ? `更新 ${payload.updated_at.replace('T',' ')}` : '';
    const edition = document.querySelector('.edition span');
    if(edition) edition.textContent = `${data.length} stories ・ ${stamp}`;

    renderHome();
  }catch(e){
    console.warn('Live news load failed; using demo data.', e);
  }
}
loadLiveNews();

</script></body></html>
