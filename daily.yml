name: Update Insight Brief

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. 20:30 UTC = 05:30 JST.
    - cron: "30 20 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch official updates
        run: python update_news.py

      - name: Commit changed data
        run: |
          git config user.name "insight-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update daily brief"
            git push
          fi
